name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: Documentation and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: npm install --global @fission-ai/openspec@1.9.0
      - run: openspec validate --all --strict
      - run: python3 scripts/check-public-tree.py
      - run: python3 tests/documentation/test-public-tree.py
      - run: python3 scripts/generate-llms.py --check
      - run: python3 tests/documentation/check-links.py
      - run: python3 tests/release/test_release.py
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: python3 tests/documentation/test-website.py
      - run: python3 scripts/build-website.py
      - name: Retain static documentation
        uses: actions/upload-artifact@v7.0.1
        with:
          name: documentation-site
          path: artifacts/documentation/site
          retention-days: 14
      - run: git diff --check

  qualify:
    name: Native macOS qualification
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Qualify committed source and packed consumers
        run: ./scripts/verify.sh
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: candidate-evidence
          path: |
            artifacts/candidates/*/result.json
            artifacts/candidates/*/artifact-manifest.json
            artifacts/candidates/*/package-set.json
            artifacts/candidates/*/logs/*.log
          if-no-files-found: warn
          retention-days: 14
