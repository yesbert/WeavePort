name: SonarQube
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOTNET_COVERAGE_TELEMETRY_OPTOUT: '1'
jobs:
  coverage:
    name: .NET coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
      - run: dotnet tool install dotnet-coverage --version 18.11.2 --tool-path artifacts/analysis-tools
      - run: python scripts/ci/sonar/coverage.py
      - name: Retain coverage and actual test exits
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sonar-coverage
          path: artifacts/analysis
          retention-days: 14

  analyze:
    name: SonarQube quality gate
    needs: coverage
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8.0.1
        with:
          name: sonar-coverage
          path: artifacts/analysis
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: dotnet tool install dotnet-sonarscanner --version 11.3.0 --tool-path artifacts/analysis-tools
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          test -n "$SONAR_TOKEN"
          test -n "$SONAR_HOST_URL"
          artifacts/analysis-tools/dotnet-sonarscanner begin \
            /k:"weaveport" /n:"WeavePort" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="artifacts/analysis/coverage.xml" \
            /d:sonar.exclusions='**/bin/**,**/obj/**,artifacts/**,reports/**,openspec/**,website/**,docs/**,samples/**,examples/**,plugins/**,benchmarks/**,tools/**,**/*.g.cs' \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.qualitygate.wait=true
      - name: Build analyzed source and mark regression projects as tests
        run: |
          set -euo pipefail
          for project in src/WeavePort.*/*.csproj; do
            dotnet build "$project" -c Debug --no-incremental --nologo
          done
          for project in WeavePort.Hosting.Tests WeavePort.Gateway.Tests WeavePort.Scheduling.Tests WeavePort.ReuseTests; do
            dotnet build "tests/$project" -c Debug --no-incremental --nologo -p:SonarQubeTestProject=true -p:BuildProjectReferences=false
          done
      - name: Submit analysis and wait for quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: artifacts/analysis-tools/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      - name: Export findings to GitHub summary
        if: always()
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_REPORT_TOKEN: ${{ secrets.SONAR_REPORT_TOKEN }}
        run: python scripts/ci/sonar/export.py
      - name: Retain complete SonarQube findings
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sonar-report
          path: artifacts/sonar-report
          if-no-files-found: error
          retention-days: 30
